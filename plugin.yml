name: TerraStick
version: ${project.version}
main: de.terrastick.TerraStick
api-version: '1.21'
description: Terraform-Stab fuer Huegel, Berge und Mauern
commands:
  terra:
    description: Gibt dir einen Terraform-Stab oder macht Undo
    usage: /terra <hill|mountain|wall|crater|tower|sphere|brush|undo> [groesse] [block(e)] [hoehe]
    permission: terrastick.use
permissions:
  terrastick.use:
    description: Erlaubt die Nutzung von TerraStick
    default: op
