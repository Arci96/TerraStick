name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build mit Maven
        run: mvn -B package
      - name: Jar hochladen
        uses: actions/upload-artifact@v4
        with:
          name: TerraStick
          path: target/TerraStick.jar
